<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Fortnight Shop</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<script>
/* Set the theme before first paint, otherwise a dark-mode user gets a white flash. */
(function () {
  try {
    var saved = localStorage.getItem("fs-theme") || "system";
    var dark = saved === "dark" || (saved === "system" &&
      window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    /* Same again for the accent, or a chosen colour arrives a frame late and
       the whole app blinks yellow on every load. */
    var accent = localStorage.getItem("fs-accent") || "";
    if (/^#[0-9a-f]{6}$/i.test(accent)) {
      var lum = [1, 3, 5].map(function (at) {
        var v = parseInt(accent.slice(at, at + 2), 16) / 255;
        return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      });
      document.documentElement.style.setProperty("--accent", accent);
      document.documentElement.style.setProperty(
        "--on-accent",
        0.2126 * lum[0] + 0.7152 * lum[1] + 0.0722 * lum[2] > 0.42 ? "#16181C" : "#FFFFFF"
      );
    }
  } catch (e) { document.documentElement.dataset.theme = "light"; }
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%2315171B'/><text x='16' y='23' font-size='20' font-family='monospace' fill='%23F5C400' text-anchor='middle'>£</text></svg>">
</head>
<body>
<div id="app" class="fb">
  <div class="wrap"><p class="muted">Loading.</p></div>
</div>

<script>
/* Boot watchdog. A module that fails to load leaves a blank page with no clue
   why, so capture the reason and show it rather than sitting on "Loading." */
(function () {
  var problems = [];
  var note = function (what) { if (what && problems.indexOf(what) === -1) problems.push(what); };

  window.addEventListener("error", function (e) {
    if (e.target && e.target.src) note("Could not load " + e.target.src);
    else note(e.message || String(e.error || "Unknown script error"));
  }, true);

  window.addEventListener("unhandledrejection", function (e) {
    note(String((e.reason && e.reason.message) || e.reason || "Unknown"));
  });

  setTimeout(function () {
    var app = document.getElementById("app");
    if (!app || app.dataset.booted === "1") return;
    app.innerHTML =
      '<div class="wrap"><div class="err"><strong>The app did not start.</strong><br>' +
      'It could not fetch one of its own files. Nearly always this is a poor connection ' +
      'while the app was updating itself, and <strong>reloading fixes it</strong>. ' +
      'If it keeps happening, one of the files below is missing on the server.</div>' +
      (problems.length
        ? '<p class="eyebrow">What went wrong</p><pre class="inp mono" style="white-space:pre-wrap;min-height:0">' +
          problems.join("\n").replace(/[<>&]/g, function (c) { return { "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]; }) +
          "</pre>"
        : "") +
      '<p class="eyebrow">Files it needs</p><p class="muted num">app.js &middot; styles.css &middot; sw.js &middot; ' +
      'lib/calc.js &middot; lib/store.js &middot; lib/scan.js &middot; lib/qr.js &middot; lib/vision.js &middot; ' +
      'lib/sync.js &middot; lib/log.js &middot; ' +
      'lib/vendor/barcode-polyfill.js &middot; lib/vendor/zxing_reader.wasm</p>' +
      '<p class="muted">Your saved data is untouched by this. It lives in the browser, not in those files.</p></div>';
  }, 5000);
})();
</script>

<script type="module" src="./app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
