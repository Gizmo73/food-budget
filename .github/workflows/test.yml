# Runs the test suite on every push and pull request.
#
# The app is static files with no build step, so this does not build anything:
# it installs a browser, serves the repo, and drives the real app in it.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # only Chromium: the app targets phone browsers, and the suite drives one
      - run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Keep any screenshots a failing test left behind
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/output/
          if-no-files-found: ignore
